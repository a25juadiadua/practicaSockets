<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket.IO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    
    <div id="divForm">
        <form action="" id="formNom" class="">
            <label for="nom">Nom d'Usuari:</label>
            <input type="text" name="nom" id="inputNom" maxlength="20">
            <input type="submit" value="Enviar nom">
        </form>

        
    </div>    

    <div id="idChat" class="d-none">
        <p id="nombreUsuario"></p>

        <div id="idMensaje"></div>

        <form action="" id="formMensaje">

            <input type="text" name="textMensaje" id="textMensaje">
            <input type="submit" value="Enviar Mensaje">
        </form>
    </div>
</body>

<script src="/socket.io/socket.io.js"></script>
<script src="funcions.js"></script>
</html>
