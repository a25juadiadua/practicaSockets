<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="bg-light">

    <div class="container mt-5">

        <div id="divForm" class="card p-3 mb-3">
            <h3>💬 Xat</h3>

            <form id="formNom">
                <label for="inputNom" class="form-label">Nom d'usuari:</label>
                <input type="text" name="nom" id="inputNom" class="form-control mb-2" maxlength="20" placeholder="Escriu el teu nom d'usuari" required>
                <button type="submit" class="btn btn-primary">Entrar</button>
            </form>
        </div>

        <div id="idChat" class="card d-none">

                        <div class="card-header bg-primary text-white">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h4 class="mb-2">💬 Xat en temps real</h4>
                        <p class="mb-1">Usuari: <span id="nombreUsuario"></span></p>
                        <span id="estatConnexio" class="small">Connectant...</span>
                    </div>
                    

                    <button id="botoDesconectar" class="btn btn-outline-light btn-sm rounded-3 p-3">
                        Desconnectar
                    </button>
                </div>
            </div>

            <div id="idChatMensaje" class="card-body overflow-auto" style="height: 300px;">
            </div>

            <div class="card-footer">
                <form id="formMensaje" class="d-flex gap-2">
                    <input type="text" name="textMensaje" id="textMensaje" class="form-control" maxlength="500" placeholder="Escriu un missatge...">
                    <button type="submit" id="botoEnviar" class="btn btn-primary">Enviar</button>
                </form>
            </div>

        </div>
        
<div class="text-center mt-4">
    <button type="button" class="btn btn-outline-secondary rounded-3 px-4" id="idVolver">
        ← Volver
    </button>
</div>


    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="funcions.js"></script>

</body>
</html>
